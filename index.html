<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Department Teaching Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F1;--surface:#FFFFFF;--sunk:#E9EDE9;--ink:#17262A;--muted:#5B6B6E;--line:#D6DDD8;
  --accent:#1F5C4F;--accent-ink:#FFFFFF;--warn:#B3261E;--warn-bg:#FBE9E7;--hol:#FFF3D1;--hol-ink:#7A5A00;
  --r-sm:6px;--r:10px;
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111A1B;--surface:#192426;--sunk:#152022;--ink:#E5ECEA;--muted:#98AAA7;--line:#2C3B3D;
  --accent:#5FB39B;--accent-ink:#0E1A18;--warn:#F2867D;--warn-bg:#3A1F1C;--hol:#3A3214;--hol-ink:#F0D27A;}}
:root[data-theme="dark"]{--bg:#111A1B;--surface:#192426;--sunk:#152022;--ink:#E5ECEA;--muted:#98AAA7;--line:#2C3B3D;
  --accent:#5FB39B;--accent-ink:#0E1A18;--warn:#F2867D;--warn-bg:#3A1F1C;--hol:#3A3214;--hol-ink:#F0D27A;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:20px 20px 60px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.brand h1{margin:0;font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted)}
.clerk{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;user-select:none}
.clerk input{width:34px;height:20px;appearance:none;background:var(--line);border-radius:999px;position:relative;cursor:pointer;margin:0;transition:background .15s}
.clerk input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:left .15s}
.clerk input:checked{background:var(--accent)}
.clerk input:checked::after{left:17px}

.tabs{display:flex;gap:4px;margin:14px 0 18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button[aria-current="true"]{background:var(--ink);color:var(--bg)}

.notice{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r-sm);padding:10px 14px;margin-bottom:16px;color:var(--muted)}
.notice b{color:var(--ink)}

/* course switch */
.courses{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.courses button{--c:var(--ink);border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:500}
.courses button::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.courses button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));font-weight:600}
.courses .all::before{background:conic-gradient(#2F6F5E 0 33%,#3D5A99 0 66%,#A8662B 0)}

/* toolbar */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r-sm);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--warn)}
.btn.sm{padding:3px 8px;font-size:.85rem}
select,input[type=text],input[type=date],input[type=time],input[type=number]{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:6px 8px;min-width:0}
.period{font-weight:700;font-size:1.1rem;min-width:200px}

.stats{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 14px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{color:var(--muted)}
.stats b{color:var(--ink);font-size:1.15rem;margin-right:4px;font-variant-numeric:tabular-nums}
.stats .bad b{color:var(--warn)}

.legend{display:flex;gap:16px;align-items:center;color:var(--muted);font-size:.85rem;margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:12px;border-radius:3px;border-left:3px solid var(--muted);background:color-mix(in srgb,var(--muted) 20%,var(--surface))}
.sw.p{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--muted) 28%,var(--surface)) 0 3px,var(--surface) 3px 6px)}

/* table */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:820px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{font-size:.82rem;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
tr.day td{background:var(--sunk);font-weight:700;padding-top:12px}
tr.day .hol{font-weight:600;color:var(--hol-ink);background:var(--hol);padding:2px 8px;border-radius:999px;margin-left:8px;font-size:.82rem}
tr.day .count{font-weight:500;color:var(--muted);margin-left:8px;font-size:.85rem}
td.time{font-variant-numeric:tabular-nums;white-space:nowrap}
.cc{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.cc i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.kind{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.8rem;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.kind.practical{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 24%,var(--surface)) 0 3px,var(--surface) 3px 6px)}
.teacher{font-weight:600}
.unassigned{color:var(--warn);background:var(--warn-bg);padding:2px 8px;border-radius:4px;font-weight:600;font-size:.85rem}
.lock{border:0;background:none;cursor:pointer;padding:2px 4px;border-radius:4px;color:var(--muted)}
.lock[aria-pressed="true"]{color:var(--accent)}
td input[type=text]{width:100%}
td select{max-width:220px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .h{background:var(--sunk);padding:6px 8px;font-size:.82rem;color:var(--muted);font-weight:600}
.cell{background:var(--surface);min-height:118px;padding:6px;display:flex;flex-direction:column;gap:4px}
.cell.out{background:var(--sunk)}
.cell.out .chip,.cell.out .dn{opacity:.45}
.cell.today .dn{background:var(--ink);color:var(--bg)}
.cell.holi{background:var(--hol)}
.dn{font-weight:700;font-size:.85rem;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.hn{font-size:.75rem;color:var(--hol-ink);font-weight:600}
.chip{font-size:.76rem;line-height:1.3;padding:3px 6px;border-radius:4px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.chip.practical{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 24%,var(--surface)) 0 3px,var(--surface) 3px 6px)}
.chip b{font-weight:600}
.chip .who{display:block;color:var(--ink)}
.chip.none .who{color:var(--warn);font-weight:600}
.dl{display:none}

/* forms / setup */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:18px}
.panel h2{margin:0 0 4px;font-size:1.15rem}
.panel > p.lead{margin:0 0 14px;color:var(--muted);max-width:75ch}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.grid-form label,.field{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500}
.batches{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.batches label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--ink);cursor:pointer}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.leaves{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border-radius:999px;padding:2px 4px 2px 10px;font-size:.8rem}
.pill button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 4px}
.help{color:var(--muted);font-size:.9rem;max-width:75ch}
.help li{margin-bottom:4px}
input[type=color]{width:38px;height:32px;border:1px solid var(--line);border-radius:var(--r-sm);padding:2px;background:var(--surface)}

/* workload */
.meter{height:8px;background:var(--sunk);border-radius:999px;position:relative;min-width:120px}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:999px}
.meter s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.diff{font-variant-numeric:tabular-nums;font-weight:600}
.diff.over{color:var(--warn)}
.num{font-variant-numeric:tabular-nums;text-align:right}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r-sm);font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:90vw}
.toast.show{opacity:1}
.print-title{display:none}


/* v2 additions */
.away{display:inline-block;margin-left:6px;font-size:.78rem;font-weight:600;color:var(--hol-ink);background:var(--hol);padding:1px 7px;border-radius:999px}
tr.isaway td{opacity:.6}
.bn{font-size:.72rem;color:var(--hol-ink);background:var(--hol);border-radius:4px;padding:2px 5px;font-weight:600}
.codes{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.code{font-size:.76rem;font-weight:600;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.code button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 0 0 4px}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);padding:0;width:min(720px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(10,20,20,.45)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font-size:1.1rem}
.dlg-b{padding:14px 18px;overflow:auto;max-height:calc(88vh - 130px)}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.clist{border:1px solid var(--line);border-radius:var(--r-sm);max-height:48vh;overflow:auto;margin-top:10px}
.clist label{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.clist label:last-child{border-bottom:0}
.clist label b{min-width:64px}
.clist .tp{color:var(--muted);font-size:.8rem}
:root{--ok:#1E7B3A;--ok-bg:#DDF2E2;--bad:#B3261E;--bad-bg:#FBE1DD}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ok:#7FD89A;--ok-bg:#173623;--bad:#F2867D;--bad-bg:#40201C}}
:root[data-theme="dark"]{--ok:#7FD89A;--ok-bg:#173623;--bad:#F2867D;--bad-bg:#40201C}
.cov td.done{background:var(--ok-bg);color:var(--ok);font-weight:600;white-space:nowrap}
.cov td.plan,.cov td.pend{background:var(--bad-bg);color:var(--bad);font-weight:600;white-space:nowrap}
.cov td.plan small{display:block;font-weight:500}
.stats .ok b{color:var(--ok)} .stats .bad2 b{color:var(--bad)}
.clist label.ok{border-left:4px solid var(--ok);background:var(--ok-bg)}
.clist label.bad{border-left:4px solid var(--bad);background:var(--bad-bg)}
.clist .st{margin-left:auto;white-space:nowrap;font-size:.8rem;font-weight:700;padding-left:10px}
.clist label.ok .st{color:var(--ok)} .clist label.bad .st{color:var(--bad)}
.nh{display:inline-block;margin-left:6px;font-size:.76rem;font-weight:700;color:var(--bad);background:var(--bad-bg);padding:1px 7px;border-radius:999px}
tr.isnotheld td{opacity:.7}
table.wide{min-width:1480px}
table.wide td input[type=text]{min-width:150px}
.acts{display:flex;flex-wrap:wrap;gap:4px;min-width:170px}
input.dup{border-color:var(--bad);background:var(--bad-bg)}
.notice.alert{border-left-color:var(--bad);color:var(--ink)}
.notice .row-actions{margin-top:8px}
.moved{display:inline-block;margin-left:6px;font-size:.76rem;font-weight:600;color:var(--muted);background:var(--sunk);border:1px dashed var(--line);padding:1px 7px;border-radius:999px;cursor:help}
.checks{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.checks li{padding:7px 10px;border-radius:var(--r-sm);font-size:.9rem}
.checks li.stop{background:var(--bad-bg);color:var(--bad);font-weight:600}
.checks li.warn{background:var(--hol);color:var(--hol-ink)}
.checks li.fine{background:var(--ok-bg);color:var(--ok)}
.imp-sum{display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 12px}
.imp-sum b{font-size:1.2rem;margin-right:4px}
.skips{border:1px solid var(--line);border-radius:var(--r-sm);max-height:220px;overflow:auto;padding:6px 10px;margin:0;list-style:none}
.skips li{padding:4px 0;border-bottom:1px solid var(--line);color:var(--bad)}
.skips li:last-child{border-bottom:0}
.cov td.ctext{min-width:260px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:1rem}
.card textarea,.dlg-b textarea{width:100%;min-height:190px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--sunk);padding:8px;font:inherit;font-size:.86rem;resize:vertical;color:var(--ink)}
a.btn{text-decoration:none;display:inline-block;color:inherit}
.cc{white-space:nowrap}
.cov td:first-child{white-space:nowrap}
table{min-width:1080px}
table.cov{min-width:720px}
details.allow summary{cursor:pointer;color:var(--accent);font-weight:600}
details.allow div{display:grid;gap:4px;margin-top:6px;max-height:180px;overflow:auto}
details.allow label{display:flex;gap:6px;align-items:center;font-size:.85rem}
.status{font-weight:600;font-size:.82rem;padding:2px 8px;border-radius:999px;background:var(--sunk)}
.status.Accepted{color:var(--accent)}
.status.Declined{color:var(--warn)}
.scroll{max-height:380px;overflow:auto}

@media (max-width:760px){
  .cal{grid-template-columns:1fr}
  .cal .h{display:none}
  .cell{min-height:0}
  .cell.out,.cell.blank{display:none}
  .dl{display:inline;margin-left:6px;font-weight:600;font-size:.85rem}
  .legend{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  :root{--bg:#fff;--surface:#fff;--sunk:#f1f1f1}
  .top .clerk,.tabs,.bar,.courses,.notice,.no-print,.lock{display:none!important}
  .print-title{display:block;margin:0 0 8px;font-size:1.1rem}
  .wrap{padding:0}
  .tbl-wrap{border:0;overflow:visible}
  table{min-width:0;font-size:11px}
  .cell{min-height:90px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
window.addEventListener('error', function(e){
  var el = document.getElementById('app');
  if(el && !el.dataset.ok) el.innerHTML = '<div class="panel"><h2>The page could not start</h2><p class="lead">' +
    String((e && e.message) || 'Unknown error') + '</p><p class="help">Send this line to Dr Chhabra.</p></div>';
});
setTimeout(function(){
  var el = document.getElementById('app');
  if(el && !el.dataset.ok && !el.innerHTML.trim()) el.innerHTML =
    '<div class="panel"><h2>Nothing came back</h2><p class="lead">The page loaded but the roster did not arrive. Reload once. If it stays empty, open the link in a window signed in only to the department account.</p></div>';
}, 12000);
</script>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".xlsx,.xls,.json" hidden>
<input type="file" id="importComps" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="importContacts" accept=".xlsx,.xls,.csv" hidden>
<dialog id="dlg"></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>


/* ============ helpers ============ */
const KEY = 'dept-roster-draft-v1';
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const dow = s => (parse(s).getDay()+6)%7;
const monday = s => addDays(s,-dow(s));
const nice = (s,o) => parse(s).toLocaleDateString('en-IN', o || {weekday:'short',day:'numeric',month:'short'});
const dmy = s => s ? s.split('-').reverse().join('-') : '';
const mins = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const t12 = t => { let [h,m] = t.split(':').map(Number); const ap = h>=12?'pm':'am'; h = h%12||12; return h+':'+pad(m)+' '+ap; };
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TODAY = iso(new Date());
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
/* a class is over once its end time has passed; it counts as held unless marked not held */
const isOver = s => s.date < TODAY || (s.date === TODAY && mins(s.end) <= nowMin());
const isHeld = s => !s.notHeld && isOver(s);
const CKEY = 'dept-roster-contacts-v1';

let S = null;
const ui = { tab:'roster', view:'table', course:'all', type:'all', teacher:'all', anchor:TODAY, edit:false,
  pf:{}, pfComps:[], wlRange:'term', covTopic:'all', covQ:'', covPending:false, msgWeek:addDays(monday(TODAY),7),
  swapFilter:'all', compQ:'', openAllow:null, allowType:{}, dlg:null, msgs:[], checks:null };

function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 3000); }
let ME = {email:'', name:'', facultyId:'', isOffice:false, prefs:{weekly:true,daily:true,swaps:true}};
let REV = 0, SHEET_URL = '', dirty = false, saveTimer = null, saveState = '';
function setState(t){ saveState = t; const el = document.getElementById('savestate'); if(el) el.textContent = t; }
function writeLocal(){}
function save(){
  if(!ME.isOffice) return;
  S.meta = S.meta || {}; S.meta.editedAt = new Date().toISOString();
  dirty = true; setState('Saving');
  clearTimeout(saveTimer); saveTimer = setTimeout(pushSave, 700);
}
function pushSave(){
  if(!ME.isOffice || !dirty) return;
  dirty = false;
  RT.save(S).then(n => { setState(n ? 'Saved' : ''); setTimeout(()=>{ if(!dirty) setState(''); }, 2000); })
    .catch(e => { dirty = true; setState('Not saved'); toast(e.message || 'Could not save. Try again.'); });
}
function reload(){
  setState('Loading');
  RT.reload().then(()=>setState('')).catch(e=>toast(e.message||'Could not load'));
}
/* called when someone else changes the roster */
function remoteUpdate(data){
  if(dirty) return;
  ui.checks = null;
  S = normalize(data);
  if(!ui.dlg) render();
}

function normalize(d){
  d.settings = d.settings || {}; d.ranks = d.ranks || []; d.faculty = d.faculty || []; d.courses = d.courses || [];
  d.sessions = d.sessions || []; d.holidays = d.holidays || []; d.blocks = d.blocks || []; d.competencies = d.competencies || []; d.swaps = d.swaps || [];
  d.types = (d.types && d.types.length) ? d.types : DEFAULT_TYPES.map(t=>({...t}));
  d.rotations = d.rotations || [];
  d.ranks.forEach(r=>{ if(!r.w){ r.w = {}; d.types.forEach(t=>r.w[t.id] = +r[t.id]||0); } d.types.forEach(t=>{ if(r.w[t.id]==null) r.w[t.id]=0; }); });
  d.holidays.forEach(h=>{ h.from = h.from || h.date || ''; h.to = h.to || h.from; delete h.date; });
  d.faculty.forEach(f=>{ f.leaves=f.leaves||[]; f.phone=f.phone||''; f.email=f.email||''; });
  d.courses.forEach(c=>{ c.batches=c.batches||[]; c.allowed=c.allowed||[]; c.allowedByType=c.allowedByType||{}; c.targets=c.targets||{}; c.termStart=c.termStart||''; c.termEnd=c.termEnd||''; });
  d.sessions.forEach(s=>{ s.comps=s.comps||[]; s.topic=s.topic||''; s.venue=s.venue||''; s.history=s.history||[]; s.notHeld=!!s.notHeld; });

const rankOf = f => S.ranks.find(r=>r.id===f.rank);
const weight = (f,type) => { const r = rankOf(f); return r && r.w ? (+r.w[type]||0) : 0; };
const rankBars = (f,type) => !!f && weight(f,type)===0;

const bats = s => s.batch==='All' ? ['All'] : String(s.batch).split('+').map(x=>x.trim()).filter(Boolean);

/* ============ the assignment engine ============
   Every class is shared out in hours. For each class the engine works out what each
   eligible person was due (their rank's ratio for that class type, against everyone
   else who could have taken it that day), then gives the class to whoever is furthest
   behind what they were due. It skips: holidays, batches that are away, people on
   leave or already teaching at that hour, and people not on the course's teacher list. */
function eligibleFor(s){
  return S.faculty.filter(f => f.active!==false && weight(f,s.type)>0 && allowed(f,s.courseId,s.type) && !onLeave(f,s.date));
}
function autoAssign(list, mode){
  const targets = list.filter(s => !s.locked && !holiday(s.date) && !away(s)).sort(byTime);
  if(mode==='redo') targets.forEach(s => s.facultyId='');
  const hrs = {}, exp = {}, day = {};
  S.faculty.forEach(f => { hrs[f.id]=0; exp[f.id]=0; day[f.id]={}; });
  const expect = s => { const el = eligibleFor(s), sw = el.reduce((a,f)=>a+weight(f,s.type),0);
    if(sw) el.forEach(f => exp[f.id] += hoursOf(s)*weight(f,s.type)/sw); };
  /* what has already been given out this term */
  for(const s of S.sessions){
    if(!inTerm(s) || s.notHeld) continue;
    if(s.facultyId && hrs[s.facultyId]!=null){ hrs[s.facultyId] += hoursOf(s); day[s.facultyId][s.date] = (day[s.facultyId][s.date]||0) + hoursOf(s); }
    if(s.facultyId || targets.includes(s)) expect(s);
  }
  let filled=0, missed=0;
  for(const s of targets){
    if(s.facultyId) continue;
    const cands = eligibleFor(s).filter(f => !busy(f.id,s));
    if(!cands.length){ missed++; continue; }
    /* furthest behind what they were due, with a small nudge to spread one person's classes across days */
    const score = f => (exp[f.id]-hrs[f.id]) - 0.25*(day[f.id][s.date]||0);
    cands.sort((a,b) => score(b)-score(a) || hrs[a.id]-hrs[b.id] || a.name.localeCompare(b.name));
    const f = cands[0];
    s.facultyId = f.id; hrs[f.id] += hoursOf(s); day[f.id][s.date] = (day[f.id][s.date]||0) + hoursOf(s);
    filled++;
  }
  return {filled, missed};
}

    const note = leave?' (on leave)':clash?' (has a clash)':notList?' (not on course list)':w===0?` (rank not given ${s.type})`:'';
    return `<option value="${x.id}" ${x.id===s.facultyId?'selected':''} ${(w===0||notList)&&x.id!==s.facultyId?'disabled':''}>${esc(x.name+note)}</option>`;
  }).join('');
  return `<select data-ch="assign" data-id="${s.id}" aria-label="Teacher"><option value="">Unassigned</option>${opts}</select>
    <button class="lock" data-act="lock" data-id="${s.id}" aria-pressed="${!!s.locked}" title="${s.locked?'Locked: auto-assign will not change this':'Unlocked: auto-assign may change this'}">${s.locked?'🔒':'🔓'}</button>`;
}

function compCell(s){
  const chips = s.comps.map(c=>`<span class="code" title="${esc(S.competencies.find(k=>k.code===c)?.text||'')}">${esc(c)}${ui.edit?`<button data-act="rmcomp" data-id="${s.id}" data-c="${esc(c)}" aria-label="Remove ${esc(c)}">×</button>`:''}</span>`).join('');
  return `<div class="codes">${chips||(ui.edit?'':'<span class="help">None</span>')}${ui.edit?`<button class="btn sm" data-act="pickcomp" data-id="${s.id}">${s.comps.length?'Change':'Choose'}</button>`:''}</div>`;
}

function timeFixPanel(){
  const t = ui.tf = ui.tf||{};
  if(!S.courses.find(c=>c.id===t.course)) t.course = S.courses[0].id;
  const c = course(t.course);
  const typesHere = S.types.filter(x=>S.sessions.some(s=>s.courseId===t.course && s.type===x.id));
  if(!typesHere.find(x=>x.id===t.type)) t.type = (typesHere[0]||S.types[0]||{}).id;
  if(!t.from) t.from = c.termStart || S.settings.termStart || TODAY;
  const pool = S.sessions.filter(s=>s.courseId===t.course && s.type===t.type && s.date>=t.from);
  const slots = [...new Set(pool.map(s=>s.start+'-'+s.end))].sort();
  if(!slots.includes(t.slot)) t.slot = slots[0]||'';
  if(!t.start || !t.end){ const [a,b]=(t.slot||'-').split('-'); t.start=t.start||a||'14:00'; t.end=t.end||b||'16:00'; }
  const n = tfList().length;
  const lab = x => { const [a,b]=x.split('-'); const k=pool.filter(s=>s.start===a&&s.end===b).length; return `${t12(a)} to ${t12(b)} (${k} class${k===1?'':'es'})`; };
  return `<div class="panel">
    <h2>Correct the time of a series</h2>
    <p class="lead">For classes entered at the wrong time. Every class of this course and type in the chosen slot, from the chosen date on, gets the new time. Date, batch, teacher, topic and venue stay as they are, and the classes are not marked as moved. To correct a single class, change its time in the roster table below.</p>
    <div class="grid-form">
      <label>Course<select data-ch="tf" data-f="course">${S.courses.map(x=>`<option value="${x.id}" ${x.id===t.course?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
      <label>Type<select data-ch="tf" data-f="type">${(typesHere.length?typesHere:S.types).map(x=>`<option value="${x.id}" ${x.id===t.type?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
      <label>From<input type="date" data-ch="tf" data-f="from" value="${t.from}"></label>
      <label style="grid-column:span 2">Now at<select data-ch="tf" data-f="slot">${slots.length?slots.map(x=>`<option value="${x}" ${x===t.slot?'selected':''}>${lab(x)}</option>`).join(''):'<option value="">No classes found</option>'}</select></label>
      <label>New start<input type="time" data-ch="tf" data-f="start" value="${t.start}"></label>
      <label>New end<input type="time" data-ch="tf" data-f="end" value="${t.end}"></label>
    </div>
    <div class="row-actions"><button class="btn primary" data-act="tfapply" ${n?'':'disabled'}>Change the time of ${n} class${n===1?'':'es'}</button></div>
  </div>`;
}

function tableHTML(from, to, list){
  if(!list.length) return `<div class="tbl-wrap"><div class="empty"><b>No classes in this week${ui.course!=='all'?' for this course':''}.</b>${ui.edit?'Add them under Plan the week, or copy last week\'s timetable there.':'Try another week or course.'}</div></div>`;
  let rows = '';
  const cols = 9;
  for(let d=from; d<=to; d=addDays(d,1)){
    const day = list.filter(s=>s.date===d), h = holiday(d), bl = blocksOn(d);
    if(!day.length && !h && !bl.length) continue;
    rows += `<tr class="day"><td colspan="${cols}">${nice(d,{weekday:'long',day:'numeric',month:'long'})}${h?`<span class="hol">${esc(h.name)}</span>`:''}${bl.map(b=>`<span class="away">${esc(blocksLabel(b))}</span>`).join('')}<span class="count">${day.length} class${day.length===1?'':'es'}</span></td></tr>`;
    for(const s of day){
      const c = course(s.courseId), aw = away(s);
      rows += `<tr style="--c:${c.color}" class="${aw?'isaway':''} ${s.notHeld?'isnotheld':''}">
        <td class="time">${ui.edit?`<input type="time" value="${s.start}" data-ch="stime" data-f="start" data-id="${s.id}" aria-label="Starts"> to <input type="time" value="${s.end}" data-ch="stime" data-f="end" data-id="${s.id}" aria-label="Ends">`:`${t12(s.start)} to ${t12(s.end)}`}<br><span class="help">${hoursOf(s).toFixed(1).replace('.0','')} h</span>${movedTag(s)}</td>
        <td><span class="cc"><i></i>${esc(c.short)}</span></td>
        <td><span class="kind ${typeOf(s.type).style==='solid'?'theory':'practical'}">${esc(typeName(s.type))}</span></td>
        <td>${esc(batsLabel(s))}${aw?`<span class="away">${esc(aw.reason)}</span>`:''}${holiday(s.date)?`<span class="away">Holiday</span>`:''}${s.notHeld?`<span class="nh">Not held</span>`:''}</td>
        <td>${ui.edit?`<input type="text" value="${esc(s.topic)}" data-ch="sfield" data-f="topic" data-id="${s.id}" aria-label="Topic">`:esc(s.topic)}</td>
        <td>${compCell(s)}</td>
        <td>${ui.edit?`<input type="text" value="${esc(s.venue)}" data-ch="sfield" data-f="venue" data-id="${s.id}" aria-label="Venue">`:esc(s.venue)}</td>
        <td>${teacherCell(s)}</td>
        <td class="no-print"><div class="acts">${s.facultyId && !isOver(s)?`<button class="btn sm" data-act="swapdlg" data-id="${s.id}">Swap</button>`:''}${ui.edit?`<button class="btn sm" data-act="reschdlg" data-id="${s.id}">Reschedule</button>`:''}${ui.edit && isOver(s)?`<button class="btn sm" data-act="notheld" data-id="${s.id}">${s.notHeld?'Mark as held':'Mark not held'}</button>`:''}${ui.edit?`<button class="btn sm danger" data-act="delsess" data-id="${s.id}" aria-label="Delete class">Delete</button>`:''}</div></td>
      </tr>`;
    }
  }
  return `<div class="tbl-wrap"><table class="${ui.edit?'wide':''}"><thead><tr><th>Time</th><th>Course</th><th>Class</th><th>Batch</th><th>Topic</th><th>Competency</th><th>Venue</th><th>Teacher</th><th class="no-print"></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function calendarHTML(from, to, first, last, list){
  let html = DAYS.map(d=>`<div class="h">${d}</div>`).join('');
  for(let d=from; d<=to; d=addDays(d,1)){
    const out = d<first || d>last, h = holiday(d), day = list.filter(s=>s.date===d), bl = blocksOn(d);
    html += `<div class="cell ${out?'out':''} ${d===TODAY?'today':''} ${h?'holi':''} ${!day.length&&!h&&!bl.length?'blank':''}">
      <div><span class="dn">${parse(d).getDate()}</span><span class="dl">${nice(d,{weekday:'long',month:'short'})}</span></div>
      ${h?`<div class="hn">${esc(h.name)}</div>`:''}
      ${bl.map(b=>`<div class="bn">${esc(blocksLabel(b))}</div>`).join('')}
      ${day.map(s=>{ const c=course(s.courseId), f=person(s.facultyId), aw=away(s);
        return `<div class="chip ${typeOf(s.type).style==='solid'?'theory':'practical'} ${f||aw?'':'none'}" style="--c:${c.color}${aw||s.notHeld?';opacity:.55':''}" title="${esc(s.topic)}${s.comps.length?' ('+esc(s.comps.join(', '))+')':''}"><b>${t12(s.start)}</b> ${esc(c.short)}, ${esc(batsLower(s))}<span class="who">${s.notHeld?'Not held':f?esc(f.name):aw?'Batch away':'Unassigned'}</span></div>`;}).join('')}
    </div>`;
  }
  return `<div class="cal">${html}</div>`;
}

          <select id="pf-rot">${rots.map(r=>`<option value="${r.id}" ${p.rot===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label>

    <p class="lead">Auto-assign counts in hours. It works out the hours each person was due, from the ratio for their rank and the class type, and gives each class to whoever is furthest behind. It skips anyone on leave, anyone already teaching at that hour, anyone not on the course's teacher list, and batches that are away. Classes you set by hand are locked and stay as they are.</p>

      <button class="btn primary" data-act="fillweek">Fill empty slots</button>
      <button class="btn" data-act="redoweek">Redo this week (keeps locked ones)</button>

      <button class="btn danger" data-act="clearweek">Remove all classes this week</button>
    </div>
  </div>
  ${tableHTML(m, to, week)}`;

/* ---------- competencies coverage ---------- */
function covStatus(cid, code, b){
  /* a whole-class lecture only counts for a batch that was not away that day */
  const ss = S.sessions.filter(s => s.courseId===cid && s.comps.includes(code) && (b==='All' || s.batch==='All' || bats(s).includes(b)) && !awayBlock(s.courseId, b==='All'?bats(s)[0]:b, s.date) && !holiday(s.date)).sort(byTime);
  const held = ss.filter(isHeld);
  if(held.length) return {k:'done', d:held[0].date, n:held.length};
  const next = ss.find(s=>!isOver(s));
  return next ? {k:'plan', d:next.date} : {k:'pend'};
}
const covCourse = () => ui.course!=='all' && S.courses.some(c=>c.id===ui.course) ? ui.course : S.courses[0]?.id;
function viewComps(){
  const cid = covCourse();
  if(!cid) return `<div class="panel"><h2>Competencies</h2><p class="lead">Add a course under Setup first.</p></div>`;
  const c = course(cid), batches = c.batches.length ? c.batches : ['All'];
  const topics = [...new Set(S.competencies.map(k=>k.topic))];
  const q = ui.covQ.toLowerCase();
  let list = S.competencies.filter(k => (ui.covTopic==='all' || k.topic===ui.covTopic) && (!q || (k.code+' '+k.text).toLowerCase().includes(q)));
  const grid = list.map(k => ({k, st: batches.map(b=>covStatus(cid,k.code,b))}));
  const shown = ui.covPending ? grid.filter(r=>r.st.some(x=>x.k!=='done')) : grid;
  const demo = !S.competencies.length || S.competencies.some(k=>k.code.startsWith('DEMO'));
  return `
  ${coursePills(true, cid)}
  ${demo?`<div class="notice">${S.competencies.length?'The competency list here is a <b>demo list</b>.':'The competency list is <b>empty</b>.'} Download the sample file, fill in the NMC competencies and upload it.${ui.edit?`<div class="row-actions"><button class="btn" data-act="comptemplate">Download sample file</button><button class="btn primary" data-act="compimport">Upload filled file</button></div>`:' Turn on Office mode to upload it.'}</div>`:''}
  <div class="bar">
    <select data-ch="covtopic" aria-label="Topic"><option value="all">All topics</option>${topics.map(t=>`<option ${t===ui.covTopic?'selected':''}>${esc(t)}</option>`).join('')}</select>
    <input type="text" placeholder="Search code or words" value="${esc(ui.covQ)}" data-ch="covq" aria-label="Search competencies">
    <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-ch="covpend" ${ui.covPending?'checked':''}> Only show what is still pending</label>
    <span class="grow"></span>
    <button class="btn" data-act="covcsv">Download as CSV (Excel)</button>
    <button class="btn" data-act="print">Print</button>
  </div>
  <div class="stats">
    ${batches.map((b,i)=>{ const done = grid.filter(r=>r.st[i].k==='done').length; return `<div>${esc(batchLabel(b))}: <span class="ok"><b>${done}</b>done</span>, <span class="bad2"><b>${grid.length-done}</b>pending</span></div>`; }).join('')}
  </div>
  <p class="help">A competency counts as covered once a class tagged with it has been held for that batch. A whole-class theory lecture counts for every batch. Green means taught. Red means pending; it stays red until the class is actually held, even if it's already on the roster. A class marked "not held" doesn't count, and a whole-class lecture doesn't count for a batch that was away that day.</p>
  <h2 class="print-title">${esc(c.name)}: competency coverage</h2>
  <div class="tbl-wrap"><table class="cov">
    <thead><tr><th>Code</th><th>Competency</th>${batches.map(b=>`<th>${esc(batchLabel(b))}</th>`).join('')}</tr></thead>
    <tbody>${shown.length? shown.map(r=>`<tr><td><b>${esc(r.k.code)}</b></td><td class="ctext">${esc(r.k.text)}</td>${r.st.map(x=>
      x.k==='done'?`<td class="done">Done ${nice(x.d,{day:'numeric',month:'short'})}</td>`:x.k==='plan'?`<td class="plan">Pending<small>on roster for ${nice(x.d,{day:'numeric',month:'short'})}</small></td>`:`<td class="pend">Pending</td>`).join('')}</tr>`).join('')
      : `<tr><td colspan="${2+batches.length}"><div class="empty"><b>Nothing to show.</b>Change the topic or search, or load the competency list under Setup.</div></td></tr>`}</tbody>
  </table></div>`;
}

/* ---------- weekly messages ---------- */
function msgFor(f, from, to){
  const list = S.sessions.filter(s=>s.facultyId===f.id && s.date>=from && s.date<=to && !away(s) && !holiday(s.date)).sort(byTime);
  if(!list.length) return null;
  const hrs = hSum(list);
  const lines = list.map(s=>{ const c=course(s.courseId);
    const mv = (s.history||[]).length ? ` (moved from ${nice(s.history[s.history.length-1].fromDate)})` : '';

/* every class measured against the rules as they stand today, not as they stood
   when the class was assigned */
function rosterChecks(){
  const out = [], seen = new Set();
  for(const s of S.sessions){
    const f = person(s.facultyId), c = course(s.courseId), t = termOf(s.courseId);
    const hol = holiday(s.date), aw = away(s);
    if(hol) out.push({sid:s.id, kind:'date', text:`Falls on a holiday (${hol.name})`});
    if(aw) out.push({sid:s.id, kind:'date', text:`${batsLabel(s)} is away (${aw.reason})`});
    if((t.from && s.date<t.from) || (t.to && s.date>t.to)) out.push({sid:s.id, kind:'date', text:`Outside the ${c.short} term`});
    if(s.batch!=='All' && (c.batches||[]).length && bats(s).some(b=>!c.batches.includes(b)))
      out.push({sid:s.id, kind:'date', text:`Batch ${esc(s.batch)} is no longer on ${c.short}`});
    if(!f){
      if(!hol && !aw && !s.notHeld) out.push({sid:s.id, kind:'teacher', text:'No teacher'});
      continue;
    }
    if(f.active===false) out.push({sid:s.id, kind:'teacher', text:`${f.name} is marked inactive`});
    if(!allowed(f,s.courseId,s.type)) out.push({sid:s.id, kind:'teacher', text:`${f.name} is not on the ${c.short} ${typeName(s.type).toLowerCase()} teacher list`});
    if(weight(f,s.type)===0) out.push({sid:s.id, kind:'teacher', text:`${rankOf(f)?.name||'That rank'} is not given ${typeName(s.type).toLowerCase()} classes`});
    if(onLeave(f,s.date)) out.push({sid:s.id, kind:'teacher', text:`${f.name} is on leave that day`});
    const clash = S.sessions.find(x=>x.id!==s.id && x.facultyId===f.id && overlaps(x,s));
    if(clash){ const k=[s.id,clash.id].sort().join('|'); if(!seen.has(k)){ seen.add(k); out.push({sid:s.id, kind:'teacher', text:`${f.name} also has ${describe(clash)} at that time`}); } }
  }
  return out.sort((a,b)=>{ const x=sess(a.sid), y=sess(b.sid); return (x?byTime(x,y):0); });
}

function viewLoad(){
  const st = S.settings;
  let from, to, label;
  if(ui.wlRange==='month'){ const d=parse(ui.anchor); from=iso(new Date(d.getFullYear(),d.getMonth(),1)); to=iso(new Date(d.getFullYear(),d.getMonth()+1,0)); label=d.toLocaleDateString('en-IN',{month:'long',year:'numeric'}); }
  else if(ui.course!=='all'){ const t=termOf(ui.course); from=t.from||'0000'; to=t.to||'9999'; label=`${course(ui.course).short} term: ${t.from?nice(t.from,{day:'numeric',month:'short',year:'numeric'}):'start'} to ${t.to?nice(t.to,{day:'numeric',month:'short',year:'numeric'}):'end'}`; }
  else { from=st.termStart||'0000'; to=st.termEnd||'9999'; label=`Term: ${st.termStart?nice(st.termStart,{day:'numeric',month:'short',year:'numeric'}):'start'} to ${st.termEnd?nice(st.termEnd,{day:'numeric',month:'short',year:'numeric'}):'end'}`; }
  const list = S.sessions.filter(x=>x.date>=from && x.date<=to && x.facultyId && !x.notHeld && (ui.course==='all'||x.courseId===ui.course));
  /* every class is shared out, in hours, among the people who could have taken it that day:
     right rank, on the course's teacher list, active and not on leave */
  const share = {};
  S.faculty.forEach(f => share[f.id] = 0);
  for(const x of list){
    const elig = S.faculty.filter(f => f.active!==false && weight(f,x.type)>0 && allowed(f,x.courseId,x.type) && !onLeave(f,x.date));
    const sw = elig.reduce((a,f)=>a+weight(f,x.type),0);
    if(sw) elig.forEach(f => share[f.id] += hoursOf(x)*weight(f,x.type)/sw);
  }
  const used = S.types.filter(t=>list.some(x=>x.type===t.id));
  const rows = S.faculty.map(f=>{
    const mine = list.filter(x=>x.facultyId===f.id);
    const hrs = hSum(mine), fair = share[f.id]||0;
    return {f, mine, hrs, fair, diff:hrs-fair};
  });
  const max = Math.max(1, ...rows.map(r=>Math.max(r.hrs, r.fair)));
  /* hour targets per course, for example the 25 hours of FMT in the 2nd Prof practical slot */
  const targetRows = [];
  S.courses.forEach(c => Object.entries(c.targets||{}).forEach(([t,h])=>{
    if(!+h) return;
    const all = S.sessions.filter(x=>x.courseId===c.id && x.type===t && !x.notHeld);
    targetRows.push({c, t, target:+h, planned:hSum(all), held:hSum(all.filter(isHeld))});
  }));
  return `
  ${coursePills()}
  <div class="bar">
    <div class="seg" role="group" aria-label="Period"><button data-act="wl" data-v="term" aria-pressed="${ui.wlRange==='term'}">Whole term</button><button data-act="wl" data-v="month" aria-pressed="${ui.wlRange==='month'}">One month</button></div>
    ${ui.wlRange==='month'?`<button class="btn" data-act="navm" data-v="-1" aria-label="Previous month">‹</button><button class="btn" data-act="navm" data-v="1" aria-label="Next month">›</button>`:''}
    <span class="period">${label}</span>
  </div>
  <p class="help">Load is counted in hours, so a three-hour tutorial weighs more than a one-hour lecture. Fair share is the hours each person should have taken, given the classes so far, the ratio for their rank and class type, the course teacher lists and their leave. Classes marked not held are left out. The black tick on each bar marks the fair share.</p>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Teacher</th><th>Rank</th>${used.map(t=>`<th class="num">${esc(t.name)}</th>`).join('')}<th class="num">Classes</th><th class="num">Hours</th><th class="num">Fair share</th><th class="num">Difference</th><th>Load</th></tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td class="teacher">${esc(r.f.name)}${r.f.active===false?' <span class="help">(inactive)</span>':''}</td>
      <td>${esc(rankOf(r.f)?.name||'')}</td>
      ${used.map(t=>`<td class="num">${r.mine.filter(x=>x.type===t.id).length}</td>`).join('')}
      <td class="num">${r.mine.length}</td>
      <td class="num"><b>${r.hrs.toFixed(1)}</b></td>
      <td class="num">${r.fair.toFixed(1)}</td>
      <td class="num diff ${r.diff>2?'over':''}">${r.diff>=0?'+':''}${r.diff.toFixed(1)}</td>
      <td><div class="meter"><i style="width:${r.hrs/max*100}%"></i><s style="left:${r.fair/max*100}%"></s></div></td>
    </tr>`).join('')}</tbody>
  </table></div>
  ${targetRows.length?`
  <div class="panel" style="margin-top:18px">
    <h2>Hours against the course targets</h2>
    <p class="lead">Held hours are classes that have already taken place. Planned hours include the ones still to come. Set the targets under Setup, in the Courses section.</p>
    <div class="tbl-wrap"><table style="min-width:0">
      <thead><tr><th>Course</th><th>Class type</th><th class="num">Target</th><th class="num">Held</th><th class="num">Planned</th><th class="num">Left to plan</th></tr></thead>
      <tbody>${targetRows.map(r=>`<tr><td>${esc(r.c.short)}</td><td>${esc(typeName(r.t))}</td><td class="num">${r.target}</td>
        <td class="num">${r.held.toFixed(1)}</td>
        <td class="num ${r.planned>r.target?'diff over':''}">${r.planned.toFixed(1)}</td>
        <td class="num">${Math.max(0, r.target-r.planned).toFixed(1)}</td></tr>`).join('')}</tbody>
    </table></div>
  </div>`:''}
  ${checksPanel()}`;
}

/* ============ rescheduling ============ */
/* clash messages for a class placed at probe's date and time */
function clashMsgs(probe, ignore){
  const out = [], v = (probe.venue||'').trim().toLowerCase();
  for(const x of S.sessions){
    if(ignore.has(x.id) || !overlaps(x,probe)) continue;
    if(x.courseId===probe.courseId && (x.batch==='All' || probe.batch==='All' || bats(x).some(b=>bats(probe).includes(b))))
      out.push(`${course(probe.courseId).short} ${batsLower(probe)} already has a class then: ${describe(x)}.`);
    const sameSlot = x.courseId===probe.courseId && x.start===probe.start && x.type===probe.type;
    if(v && !sameSlot && (x.venue||'').trim().toLowerCase()===v)
      out.push(`${probe.venue} is already in use then: ${describe(x)}.`);
  }
  return [...new Set(out)];
}
function movedTag(s){
  if(!s.history || !s.history.length) return '';
  const h = s.history[s.history.length-1];
  const tip = s.history.map(x=>`${nice(x.fromDate)} ${t12(x.fromStart)} moved to ${nice(x.toDate)} ${t12(x.toStart)}: ${x.reason}${x.note?' ('+x.note+')':''}, done ${nice(x.on,{day:'numeric',month:'short'})}`).join('\n');
  return `<br><span class="moved" title="${esc(tip)}">Moved from ${nice(h.fromDate,{day:'numeric',month:'short'})}</span>`;
}
/* other batches of the same practical/theory slot, moved together by default */
const siblings = s => S.sessions.filter(x => x.id!==s.id && x.courseId===s.courseId && x.date===s.date && x.start===s.start && x.end===s.end && x.type===s.type);
function reschChecks(){
  const d = ui.dlg, s = sess(d.sid), out = [];
  if(!d.date) out.push({k:'stop', t:'Pick the new date.'});
  if(!d.start || !d.end || mins(d.end)<=mins(d.start)) out.push({k:'stop', t:'The end time must be after the start time.'});
  if(out.length) return out;
  if(d.date===s.date && d.start===s.start && d.end===s.end) out.push({k:'stop', t:'The new slot is the same as the current one.'});
  const h = holiday(d.date); if(h) out.push({k:'warn', t:`${nice(d.date)} is a holiday (${h.name}). No teacher will be assigned unless you keep the current one.`});
  const group = [s, ...(d.withSibs ? siblings(s) : [])], ids = new Set(group.map(x=>x.id));
  for(const g of group){
    const probe = {...g, date:d.date, start:d.start, end:d.end};
    const aw = bats(g).map(b=>awayBlock(g.courseId, b, d.date)).find(Boolean);
    if(aw) out.push({k:'stop', t:`${batsLabel(g)} is away on ${nice(d.date)} (${aw.reason}).`});
    if(d.venue.trim()) probe.venue = d.venue.trim();
    clashMsgs(probe, ids).forEach(t => out.push({k:'warn', t}));
    const f = person(g.facultyId);
    if(f && d.teacher==='keep'){
      if(onLeave(f,d.date)) out.push({k:'warn', t:`${f.name} is on leave that day, so ${batsLower(g)} will be given to someone else.`});
      else if(S.sessions.some(x=>!ids.has(x.id) && x.facultyId===f.id && overlaps(x,probe))) out.push({k:'warn', t:`${f.name} has another class at that time, so ${batsLower(g)} will be given to someone else.`});
    }
  }
  if(!out.length) out.push({k:'fine', t:'No clashes found. Ready to move.'});
  return out;
}
function applyResched(){
  const d = ui.dlg, s = sess(d.sid);
  if(reschChecks().some(x=>x.k==='stop')) return false;
  const group = [s, ...(d.withSibs ? siblings(s) : [])], ids = new Set(group.map(x=>x.id)), redo = [];
  for(const g of group){
    g.history = g.history || [];
    g.history.push({fromDate:g.date, fromStart:g.start, fromEnd:g.end, toDate:d.date, toStart:d.start, toEnd:d.end, reason:d.reason, note:d.note, on:TODAY});
    g.date=d.date; g.start=d.start; g.end=d.end; g.notHeld=false; if(d.venue.trim()) g.venue=d.venue.trim();
    const f = person(g.facultyId);
    const keepOk = f && d.teacher==='keep' && !onLeave(f,g.date) && !S.sessions.some(x=>x.id!==g.id && x.facultyId===f.id && overlaps(x,g));
    if(!keepOk){ g.facultyId=''; g.locked=false; redo.push(g); }
  }
  const r = redo.length ? autoAssign(redo,'fill') : {filled:0,missed:0};
  return {n:group.length, r, redo:redo.length};
}

/* first held class that taught this code to this batch (ignoring the class being edited) */
function taughtOn(cid, code, b, skipId){
  const s = S.sessions.filter(s => s.id!==skipId && s.courseId===cid && s.comps.includes(code) && (b==='All' || s.batch==='All' || bats(s).includes(b)) && isHeld(s) && !awayBlock(s.courseId, b==='All'?bats(s)[0]:b, s.date) && !holiday(s.date)).sort(byTime)[0];
  return s ? s.date : '';
}
function pickStatus(k){
  const d = ui.dlg, dates = d.bat.map(b=>taughtOn(d.cid, k.code, b, d.skip));
  if(dates.every(Boolean)){ const last = dates.slice().sort().pop(); return {ok:true, t:'Taught '+nice(last,{day:'numeric',month:'short'})}; }
  const left = d.bat.filter((b,i)=>!dates[i]);
  return {ok:false, t: dates.some(Boolean) ? 'Pending for '+left.map(b=>b==='All'?'whole class':b).join(', ') : 'Pending'};
}
function compListHTML(){
  const d = ui.dlg, q = d.q.toLowerCase();
  let list = S.competencies.filter(k => (d.topic==='all'||k.topic===d.topic) && (!q || (k.code+' '+k.text).toLowerCase().includes(q))).map(k=>({k, st:pickStatus(k)}));
  if(d.show==='pending') list = list.filter(x=>!x.st.ok); else if(d.show==='taught') list = list.filter(x=>x.st.ok);
  if(!list.length) return `<div class="empty"><b>No match.</b>${S.competencies.length?'Try other words or another filter.':'The list is empty. Upload it under Setup.'}</div>`;
  return list.slice(0,300).map(({k,st})=>`<label class="${st.ok?'ok':'bad'}"><input type="checkbox" data-ch="ctoggle" data-c="${esc(k.code)}" ${d.sel.includes(k.code)?'checked':''}><b>${esc(k.code)}</b><span>${esc(k.text)}<br><span class="tp">${esc(k.topic)}</span></span><span class="st">${esc(st.t)}</span></label>`).join('');
}

    const topics = [...new Set(S.competencies.map(k=>k.topic))];
    const who = d.bat.length===1 ? (d.bat[0]==='All'?'the whole class':'batch '+d.bat[0]) : 'batches '+d.bat.join(', ');
    el.innerHTML = `<div class="dlg-h"><h2>Choose NMC competencies</h2><button class="btn sm" data-act="dlgclose">Close</button></div>
    <div class="dlg-b">
      <div class="bar" style="margin:0"><input type="text" id="cq" placeholder="Type a code or words, e.g. FM2.1 or hanging" value="${esc(d.q)}" style="flex:1" aria-label="Search">

      <p class="help" style="margin:8px 0 0">Colours are for ${esc(course(d.cid).short)}, ${esc(who)}. Green: already taught. Red: pending.</p>
      <p class="help" style="margin:4px 0 0">Selected: <span id="csel">${d.sel.length?esc(d.sel.join(', ')):'none'}</span></p>
      <div class="clist" id="clist">${compListHTML()}</div>
    </div>
    <div class="dlg-f"><button class="btn" data-act="dlgclose">Cancel</button><button class="btn primary" data-act="compsave">Use these</button></div>`;
    return;
  }
  if(d.kind==='holfix'){
    const to = d.to || d.date;
    const list = S.sessions.filter(s=>s.date>=d.date && s.date<=to).sort(byTime), h = holiday(d.date);
    el.innerHTML = `<div class="dlg-h"><h2>Classes on ${esc(nice(d.date,{weekday:'long',day:'numeric',month:'long'}))}${to!==d.date?' to '+esc(nice(to,{weekday:'long',day:'numeric',month:'long'})):''}</h2><button class="btn sm" data-act="dlgclose">Close</button></div>
    <div class="dlg-b">

  if(d.kind==='resched'){

        <label style="grid-column:span 2">Note (optional)<input type="text" data-ch="rs" data-f="note" value="${esc(d.note)}" placeholder="e.g. Gandhi Jayanti declared holiday"></label>

        <div class="batches">
          <label><input type="radio" name="rst" data-ch="rs" data-f="teacher" value="keep" ${d.teacher==='keep'?'checked':''}> Keep ${esc(f?.name||'the same teacher')} if free</label>

      ${sib.length?`<label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" data-ch="rs" data-f="withSibs" ${d.withSibs?'checked':''}> Also move the other ${sib.length} batch${sib.length===1?'':'es'} in this slot (${esc(sib.map(x=>batsLower(x)).join(', '))})</label>`:''}
      <ul class="checks">${checks.map(c=>`<li class="${c.k}">${esc(c.t)}</li>`).join('')}</ul>

  if(d.kind==='swap'){

    const theirs = d.to ? S.sessions.filter(x=>x.facultyId===d.to && !isOver(x) && x.id!==s.id && !away(x) && !rankBars(from,x.type) && !(from && !allowed(from,x.courseId,x.type))).sort(byTime) : [];

}
function draftSwap(){
  const d = ui.dlg, s = sess(d.sid), ex = d.ex ? sess(d.ex) : null;
  return {id:uid(), loggedOn:TODAY, sessionId:s.id, classText:describe(s), fromId:s.facultyId, toId:d.to, exchangeId:ex?ex.id:'', exchangeText:ex?describe(ex):'', reason:d.reason, status:'Requested', decidedOn:''};
}
/* the same checks the office page makes, run before a teacher accepts */
function swapRankStop(sw){
  const s = sess(sw.sessionId), to = person(sw.toId), from = person(sw.fromId), ex = sw.exchangeId ? sess(sw.exchangeId) : null, out = [];
  if(s && rankBars(to,s.type)) out.push(rankMsg(to,s.type));
  if(ex && rankBars(from,ex.type)) out.push(rankMsg(from,ex.type));
  if(s && to && !allowed(to,s.courseId,s.type)) out.push(`${to.name} is not on the teacher list for ${course(s.courseId).short} ${typeName(s.type).toLowerCase()}`);
  if(ex && from && !allowed(from,ex.courseId,ex.type)) out.push(`${from.name} is not on the teacher list for ${course(ex.courseId).short} ${typeName(ex.type).toLowerCase()}`);
  return out;
}
function swapProblems(sw){
  const s = sess(sw.sessionId), to = person(sw.toId), out = [];
  if(!s) return ['That class is no longer on the roster'];
  if(!to) return ['That teacher is no longer on the faculty list'];
  if(onLeave(to,s.date)) out.push(`${to.name} is on leave that day`);
  if(S.sessions.some(x=>x.id!==s.id && x.id!==sw.exchangeId && x.facultyId===to.id && overlaps(x,s))) out.push(`${to.name} has another class at that time`);
  const ex = sw.exchangeId ? sess(sw.exchangeId) : null, from = person(sw.fromId);
  if(ex && from){
    if(onLeave(from,ex.date)) out.push(`${from.name} is on leave on the day of the exchange class`);
    if(S.sessions.some(x=>x.id!==ex.id && x.id!==s.id && x.facultyId===from.id && overlaps(x,ex))) out.push(`${from.name} has another class at the time of the exchange class`);
  }
  return out;
}
function applySwap(sw){
  const s = sess(sw.sessionId), to = person(sw.toId);
  if(!s || !to){ toast('That class or teacher is no longer on the roster'); return false; }
  const ex = sw.exchangeId ? sess(sw.exchangeId) : null;
  const probs = [];
  if(onLeave(to,s.date)) probs.push(`${to.name} is on leave that day`);
  if(S.sessions.some(x=>x.id!==s.id && x.id!==sw.exchangeId && x.facultyId===to.id && overlaps(x,s))) probs.push(`${to.name} has another class at that time`);
  const from = person(sw.fromId);
  if(ex && from){
    if(onLeave(from,ex.date)) probs.push(`${from.name} is on leave on the day of the exchange class`);
    if(S.sessions.some(x=>x.id!==ex.id && x.id!==s.id && x.facultyId===from.id && overlaps(x,ex))) probs.push(`${from.name} has another class at the time of the exchange class`);
  }
  const stop = swapRankStop(sw);
  if(stop.length){ alert(stop.join('. ')+'. This swap cannot be applied.'); return false; }
  if(probs.length && !confirm(probs.join('. ')+'. Apply the swap anyway?')) return false;
  s.facultyId = sw.toId; s.locked = true;
  if(ex){ ex.facultyId = sw.fromId; ex.locked = true; }
  sw.status = 'Accepted'; sw.decidedOn = TODAY;
  return true;
}

    case 'fillweek': case 'redoweek': {

    case 'copyweek': copyWeek(); break;

      if(!n || !confirm(`Delete all ${n} classes in this week?`)) return;

      else { const s=sess(id); cid=s.courseId; bat=bats(s); skip=s.id; }

    case 'swapdlg': openDlg({kind:'swap', sid:id, to:'', ex:'', reason:''}); return;
    case 'reschdlg': { const s=sess(id); if(ui.dlg && ui.dlg.kind==='holfix') ui.holfixTo=ui.dlg.to; openDlg({kind:'resched', back:el.dataset.back||'', sid:id, date:s.date<TODAY?TODAY:s.date, start:s.start, end:s.end, venue:'', reason:'Holiday declared', note:'', teacher:'keep', withSibs:true}); return; }
    case 'reschapply': { const back=ui.dlg.back; const res=applyResched(); if(!res) return; save();

    case 'notheld': { const s=sess(id); s.notHeld=!s.notHeld; save(); toast(s.notHeld?'Marked as not held. Its competencies go back to pending.':'Marked as held'); break; }
    case 'holdel': { const d=ui.dlg.date, t=ui.dlg.to||d, n=S.sessions.filter(s=>s.date>=d && s.date<=t).length;
      if(!confirm(`Delete all ${n} classes from ${nice(d)} to ${nice(t)}?`)) return;
      S.sessions=S.sessions.filter(s=>s.date<d || s.date>t); save(); closeDlg(); toast('Classes deleted'); break; }
    case 'holkeep': closeDlg(); toast('Left on the roster, marked as holiday'); break;

    case 'exportcontacts': exportContacts(); return;
    case 'importcontacts': if(!window.XLSX){ toast('The Excel reader could not load.'); return; } document.getElementById('importContacts').click(); return;

    case 'swapsend': {
      const d = ui.dlg; d.reason = document.getElementById('swreason').value;

      setState('Sending');
      RT.offerSwap({sessionId:s.id, classText:describe(s), fromId:s.facultyId, toId:d.to, exchangeId:d.ex||'',
          exchangeText:d.ex?describe(sess(d.ex)):'', reason:d.reason||''})

      if(a==='swapaccept'){
        const stop = swapRankStop(sw);
        if(stop.length){ alert(stop.join('. ')+'. This swap cannot be accepted. Decline it, or ask the office.'); return; }
        const probs = swapProblems(sw);
        if(probs.length && !confirm(probs.join('. ')+'. Take it anyway?')) return;
      }
      setState('Sending');
      RT.respondSwap(sw, a==='swapaccept')
        .then(()=>{ setState(''); toast(a==='swapaccept'?'Accepted. The roster has changed.':'Declined.'); })
        .catch(e=>{ setState(''); toast(e.message||'Could not answer the offer'); });
      return; }
    case 'reload': reload(); return;
    case 'check': ui.checks = rosterChecks(); break;
    case 'redoall': {
      const open = S.sessions.filter(x=>!x.locked && !holiday(x.date) && !away(x));
      const locked = S.sessions.filter(x=>x.locked).length;
      if(!open.length){ toast('Every class is locked, so there is nothing to redo'); return; }

      const r = autoAssign(S.sessions, 'redo'); save();
      ui.checks = rosterChecks();
      toast(`Redone. ${report(r)}`); break; }
    case 'reschedall': {
      const ids = [...new Set((ui.checks||[]).filter(x=>x.kind==='date').map(x=>x.sid))];
      const list = ids.map(sess).filter(Boolean);
      if(!list.length){ toast('Nothing to move'); return; }
      if(!confirm(`Move ${list.length} class${list.length===1?'':'es'} to the next clear date, keeping the same weekday and time?`)) return;
      let moved=0, stuck=0; const redo=[];
      for(const g of list){
        const t = termOf(g.courseId);
        /* the same weekday first, because that is where the slot belongs;
           if every one of those is taken by the weekly class, any later day will do */
        const tries = [];
        for(let w=1; w<=12; w++) tries.push(addDays(g.date, 7*w));
        for(let n=1; n<=60; n++) tries.push(addDays(g.date, n));
        let to = '';
        for(const d of tries){
          if(t.to && d > t.to) continue;
          if(dow(d)===6) continue;
          if(holiday(d)) continue;
          if(bats(g).some(b=>awayBlock(g.courseId, b, d))) continue;
          if(S.sessions.some(x=>x.id!==g.id && x.courseId===g.courseId && x.date===d && x.start===g.start
              && (x.batch==='All' || g.batch==='All' || bats(x).some(b=>bats(g).includes(b))))) continue;
          to = d; break;
        }
        if(!to){ stuck++; continue; }
        g.history = g.history || [];
        g.history.push({fromDate:g.date, fromStart:g.start, fromEnd:g.end, toDate:to, toStart:g.start, toEnd:g.end,
          reason:'Moved by the roster check', note:'', on:TODAY});
        g.date = to; g.notHeld = false;
        const f = person(g.facultyId);
        const keep = f && !onLeave(f,g.date) && !S.sessions.some(x=>x.id!==g.id && x.facultyId===f.id && overlaps(x,g));
        if(!keep){ g.facultyId=''; g.locked=false; redo.push(g); }
        moved++;
      }
      const r = redo.length ? autoAssign(redo,'fill') : {filled:0,missed:0};
      save(); ui.checks = rosterChecks();
      toast(`Moved ${moved}.${stuck?` ${stuck} had no clear date in the next 12 weeks, so ${stuck===1?'it was':'they were'} left alone.`:''}${redo.length?' '+report(r):''}`);
      break; }
    case 'fixall': {
      const ids = [...new Set((ui.checks||[]).filter(x=>x.kind==='teacher').map(x=>x.sid))];
      const list = ids.map(sess).filter(Boolean);
      if(!list.length){ toast('Nothing to reassign'); return; }
      if(!confirm(`Empty ${list.length} class${list.length===1?'':'es'} and let auto-assign fill them again under today's rules?`)) return;

    case 'deltype': { const n=S.sessions.filter(x=>x.type===id).length;

      S.rotations=S.rotations.filter(x=>x.id!==id); save(); break; }
    case 'addrotentry': { const r=S.rotations.find(x=>x.id===id);

      const e=sorted[+el.dataset.i]; r.entries=r.entries.filter(x=>x!==e); save(); break; }

    case 'addfac': S.faculty.push({id:uid(),name:'New teacher',rank:S.ranks[S.ranks.length-1]?.id,active:true,leaves:[],phone:'',email:''}); save(); break;
    case 'delfac': { const f=person(id); if(!confirm(`Delete ${f.name}? Their classes become unassigned. To keep their record, untick Active instead.`)) return;
      S.faculty=S.faculty.filter(x=>x.id!==id); S.sessions.forEach(s=>{ if(s.facultyId===id){ s.facultyId=''; s.locked=false; } });
      S.courses.forEach(c=>c.allowed=c.allowed.filter(x=>x!==id)); save(); break; }
    case 'addleave': { const from=document.getElementById('lf-'+id).value, to=document.getElementById('lt-'+id).value||from;
      if(!from){ toast('Pick the first day of leave'); return; } const f=person(id); f.leaves.push({from, to: to<from?from:to});
      const t2 = to<from?from:to;
      let clash=S.sessions.filter(s=>s.facultyId===id && !s.locked && s.date>=from && s.date<=t2);
      const hand=S.sessions.filter(s=>s.facultyId===id && s.locked && s.date>=from && s.date<=t2);
      let kept = 0;
      if(hand.length){
        if(confirm(`${hand.length} class${hand.length===1?' was':'es were'} set by hand for ${f.name} in these dates. Hand ${hand.length===1?'it':'them'} to others as well?`)){ hand.forEach(s=>s.locked=false); clash=clash.concat(hand); }
        else kept = hand.length;
      }
      clash.forEach(s=>s.facultyId=''); if(clash.length) autoAssign(clash,'fill');
      save(); toast(`Leave added.${clash.length?` ${clash.length} class${clash.length===1?'':'es'} handed to others.`:''}${kept?` ${kept} left with ${f.name} and flagged "On leave".`:''}`); break; }
    case 'delleave': person(id).leaves.splice(+el.dataset.i,1); save(); break;
    case 'allowtoggle': return;
    case 'addcourse': S.courses.push({id:uid(),name:'New course',short:'NEW',color:'#6B5B95',batches:[],allowed:[]}); save(); break;
    case 'delcourse': { const n=S.sessions.filter(s=>s.courseId===id).length;
      if(!confirm(`Delete this course${n?` and its ${n} classes`:''}?`)) return;
      S.courses=S.courses.filter(c=>c.id!==id); S.sessions=S.sessions.filter(s=>s.courseId!==id); S.blocks=S.blocks.filter(b=>b.courseId!==id); if(ui.course===id) ui.course='all'; save(); break; }
    case 'addblock': addBlock(); return;
    case 'delblock': if(!confirm('Delete this entry? The batch will be treated as present on those days again.')) return; S.blocks=S.blocks.filter(b=>b.id!==id); save(); break;
    case 'addhol': { const d=document.getElementById('hol-d').value, t=document.getElementById('hol-t').value||d, n=document.getElementById('hol-n').value.trim();
      if(!d||!n){ toast('Give the first date and a name'); return; }
      const to = t<d ? d : t;
      S.holidays=S.holidays.filter(h=>h.from!==d); S.holidays.push({from:d, to, name:n}); save();
      const hit=S.sessions.filter(s=>s.date>=d && s.date<=to);
      if(hit.length){ render(); openDlg({kind:'holfix', date:d, to}); return; } break; }
    case 'delhol': S.holidays=S.holidays.filter(h=>h.from!==el.dataset.d); save(); break;
    case 'addcompk': { const code=document.getElementById('ck-code').value.trim(), topic=document.getElementById('ck-topic').value.trim(), text=document.getElementById('ck-text').value.trim();
      if(!code||!text){ toast('Give the code and the competency'); return; }
      S.competencies=S.competencies.filter(k=>k.code!==code); S.competencies.push({code,topic:topic||'Other',text}); sortComps(); save(); break; }
    case 'delcompk': S.competencies=S.competencies.filter(k=>k.code!==el.dataset.c); save(); break;
    case 'compclear': if(!confirm('Delete the whole competency list? Classes keep their codes.')) return; S.competencies=[]; save(); break;
    case 'compimport': if(!window.XLSX){ toast('The Excel reader could not load. Check the internet connection.'); return; } document.getElementById('importComps').click(); return;
    case 'comptemplate': compTemplate(); return;
    case 'compload': {
      const d=ui.dlg, r=d.r;
      if(d.rmDemo) S.competencies = S.competencies.filter(k=>!k.code.startsWith('DEMO'));
      r.good.forEach(k=>{ const e=S.competencies.find(x=>x.code.toLowerCase()===k.code.toLowerCase()); if(e){ e.text=k.text; e.topic=k.topic; } else S.competencies.push(k); });
      sortComps(); save(); closeDlg();
      toast(`Loaded: ${r.added} new, ${r.updated} updated${r.skipped.length?`, ${r.skipped.length} rows skipped`:''}`); break; }
    /* data */
    case 'export': exportXLSX(); return;
    case 'import': document.getElementById('importFile').click(); return;
    case 'reset': if(!confirm('Replace everything in this browser with the sample data?')) return; sample(); save(); break;
  }
  render();
}

function change(c, el){
  const id = el.dataset.id, f = el.dataset.f;
  switch(c){
    case 'edit': ui.edit = el.checked && ME.isOffice; break;
    case 'type': ui.type = el.value; break;
    case 'teacher': ui.teacher = el.value; break;
    case 'pfcourse': snapshotPF(); ui.pf.batches=['All']; ui.pf.batchesFor=el.value; ui.pf.course=el.value; ui.pf.mode='separate'; render(); return;
    case 'pfmode': snapshotPF(); ui.pf.mode=el.value; render(); return;
    case 'assign': { const s=sess(id); s.facultyId=el.value; s.locked=!!el.value; save(); break; }
    case 'sfield': sess(id)[f] = el.value; save(); return;
    /* correcting a class's time where it stands: not a move, so nothing goes into its history */
    case 'stime': { const s=sess(id), v=el.value; if(!s || !v) break;
      const dur = mins(s.end)-mins(s.start);
      if(f==='start'){ s.start=v; if(mins(s.end)<=mins(v)){ const e=Math.min(mins(v)+dur, 23*60+59); s.end=pad(Math.floor(e/60))+':'+pad(e%60); } }
      else { if(mins(v)<=mins(s.start)){ toast('The end time must be after the start time'); break; } s.end=v; }
      save(); toast(timeNote([s])); break; }
    case 'tf': ui.tf = ui.tf||{}; ui.tf[f]=el.value; if(f==='course'||f==='type'||f==='from') ui.tf.slot=''; break;
    case 'set': S.settings[f] = el.value; save(); break;
    case 'rank': { const r=S.ranks.find(x=>x.id===id); r[f] = el.value; save(); break; }
    case 'rankw': { const r=S.ranks.find(x=>x.id===id); r.w[f] = Math.max(0, +el.value||0); save(); break; }
    case 'ctype': { const t=S.types.find(x=>x.id===id); t[f] = el.value; save(); break; }
    case 'fac': { const p=person(id); p[f] = (f==='active'||f==='office') ? el.checked : el.value.trim();
      if(f==='name' && S.faculty.some(x=>x.id!==id && x.name.trim().toLowerCase()===p.name.toLowerCase())) toast('Two teachers now share this name. Add an initial so the Excel file can tell them apart.');
      save(); break; }
    case 'course': {
      const k=S.courses.find(x=>x.id===id);
      if(f==='targets'){
        const tg={};
        el.value.split(';').map(x=>x.trim()).filter(Boolean).forEach(part=>{
          const m = part.match(/^(.*?)[\s:]+([\d.]+)$/); if(!m) return;
          const ty = S.types.find(t=>t.name.toLowerCase()===m[1].trim().toLowerCase() || t.id===m[1].trim().toLowerCase());
          if(ty) tg[ty.id] = +m[2]; else toast(`"${m[1].trim()}" is not a class type, so that target was left out`);
        });
        k.targets=tg; save(); break; }
      if(f!=='batches'){ k[f]=el.value; save(); break; }
      const old=k.batches, nw=el.value.split(',').map(x=>x.trim()).filter(Boolean);
      const removed=old.filter(b=>!nw.includes(b)), added=nw.filter(b=>!old.includes(b));
      const used=removed.filter(b=>S.sessions.some(s=>s.courseId===id && s.batch===b) || S.blocks.some(x=>x.courseId===id && x.batches.includes(b)));
      if(used.length){
        const map = removed.length===added.length ? removed.map((b,i)=>b+' to '+added[i]).join(', ') : '';
        if(map && confirm(`Classes already exist for ${used.join(', ')}. Rename them in the existing classes and away entries too (${map})?`)){
          const m = Object.fromEntries(removed.map((b,i)=>[b,added[i]]));
          S.sessions.forEach(s=>{ if(s.courseId===id && m[s.batch]) s.batch=m[s.batch]; });
          S.blocks.forEach(x=>{ if(x.courseId===id) x.batches=x.batches.map(b=>m[b]||b); });
        } else if(!confirm(`${S.sessions.filter(s=>s.courseId===id && used.includes(s.batch)).length} existing classes use ${used.join(', ')}. They will not appear under the new batch names. Save the change anyway?`)){ render(); return; }
      }
      k.batches=nw; save(); break; }
    case 'allow': {
      const k=S.courses.find(x=>x.id===id), sc=(ui.allowType||{})[id]||'';
      if(sc){ k.allowedByType = k.allowedByType||{}; const cur = k.allowedByType[sc]||[];
        k.allowedByType[sc] = el.checked ? [...new Set([...cur,f])] : cur.filter(x=>x!==f); }
      else k.allowed = el.checked ? [...new Set([...k.allowed,f])] : k.allowed.filter(x=>x!==f);
      ui.openAllow=id; save(); break; }
    case 'allowtype': { ui.allowType = ui.allowType||{}; ui.allowType[id] = el.value; ui.openAllow=id; break; }
    case 'bkcourse': ui.bkCourse = el.value; ui.bk = {f:document.getElementById('bk-f').value, t:document.getElementById('bk-t').value, r:document.getElementById('bk-r').value}; break;
    case 'covtopic': ui.covTopic = el.value; break;
    case 'covq': ui.covQ = el.value; break;
    case 'covpend': ui.covPending = el.checked; break;
    case 'compq': ui.compQ = el.value; break;
    case 'swapfilter': ui.swapFilter = el.value; break;
    case 'pref': { ME.prefs = ME.prefs||{}; ME.prefs[f] = el.checked;
      RT.setPrefs(ME.prefs).then(()=>toast('Saved')).catch(e=>toast(e.message||'Could not save'));
      break; }
    /* dialog fields: re-render only the dialog */
    case 'ctoggle': { const d=ui.dlg, code=el.dataset.c; d.sel = el.checked ? [...d.sel, code] : d.sel.filter(x=>x!==code); document.getElementById('csel').textContent = d.sel.length?d.sel.join(', '):'none'; return; }
    case 'ctopic': ui.dlg.topic = el.value; renderDlg(); return;
    case 'cshow': ui.dlg.show = el.value; renderDlg(); return;
    case 'rmdemo': ui.dlg.rmDemo = el.checked; return;
    case 'swto': ui.dlg.to = el.value; ui.dlg.ex=''; ui.dlg.reason=document.getElementById('swreason').value; renderDlg(); return;
    case 'swex': ui.dlg.ex = el.value; ui.dlg.reason=document.getElementById('swreason').value; renderDlg(); return;
    case 'swreason': ui.dlg.reason = el.value; renderDlg(); return;
    case 'rs': ui.dlg[f] = f==='withSibs' ? el.checked : el.value; renderDlg(); return;
  }
  render();
}

function timeNote(list){
  const n = list.filter(s=>{ const f=person(s.facultyId); return f && S.sessions.some(x=>x.id!==s.id && x.facultyId===f.id && overlaps(x,s)); }).length;
  return n ? `Time changed. ${n} class${n===1?' now clashes':'es now clash'} with another class of the same teacher; press Check the roster on the Roster tab to see and reassign.` : `Time changed${list.length>1?' on '+list.length+' classes':''}.`;
}
function tfList(){
  const t = ui.tf||{}; if(!t.slot) return [];
  const [a,b] = t.slot.split('-');
  return S.sessions.filter(s=>s.courseId===t.course && s.type===t.type && s.start===a && s.end===b && s.date>=(t.from||''));
}
function report(r){ return r.missed ? `Filled ${r.filled}. ${r.missed} class${r.missed===1?' has':'es have'} no free teacher; check leave, clashes or the course's teacher list.` : `Filled ${r.filled} class${r.filled===1?'':'es'}.`; }
const sortComps = () => S.competencies.sort((a,b)=>a.code.localeCompare(b.code, undefined, {numeric:true}));

function addClass(){
  const g = id => document.getElementById(id).value;
  const date=g('pf-day'), start=g('pf-start'), end=g('pf-end'), courseId=g('pf-course'), type=g('pf-type');
  const freq=+g('pf-freq'), until=g('pf-until'), topic=g('pf-topic').trim(), venue=g('pf-venue').trim();
  const mode=(document.querySelector('.pf-m:checked')||{}).value || 'separate';
  const rot = mode==='rotation' ? S.rotations.find(r=>r.id===(document.getElementById('pf-rot')||{}).value) : null;
  let batches=[...document.querySelectorAll('.pf-b:checked')].map(x=>x.value);
  if(!start||!end||mins(end)<=mins(start)){ toast('The end time must be after the start time'); return; }
  if(mode==='rotation' && !rot){ toast('Pick a rotation, or add one under Setup'); return; }
  if(mode!=='rotation'){
    if(!batches.length){ toast('Tick the whole class or at least one batch'); return; }
    if(batches.includes('All')) batches=['All'];
  }
  /* the dates this class falls on */
  const term = termOf(courseId);
  const stop = until==='term' ? (term.to || addDays(date, 7*52)) : addDays(date, 7*(+until));
  const dates = [];
  if(freq===0) dates.push(date); else for(let d=date; d<=stop; d=addDays(d,7*freq)) dates.push(d);

  const made=[]; let skipped=0, offRot=0;
  for(const d of dates){
    if(holiday(d)) { skipped++; continue; }
    let groups;
    if(mode==='rotation'){ const e = rotationOn(rot, d); if(!e){ offRot++; continue; } groups=[e.batches.join('+')]; }
    else if(mode==='together') groups=[batches.join('+')];
    else groups=batches;
    for(const b of groups){
      const probe={id:uid(), date:d, start, end, courseId, type, batch:b, topic, comps:[...ui.pfComps], venue, facultyId:'', locked:false, history:[], notHeld:false};
      if(away(probe)){ skipped++; continue; }
      made.push(probe);
    }
  }
  if(!made.length){ toast(`Nothing to add${skipped?`: every date is a holiday or the batch is away`:offRot?': the rotation covers none of those dates':''}`); return; }
  const msgs=[...new Set(made.flatMap(m=>clashMsgs(m, new Set())))];
  if(msgs.length && !confirm(`Clashes found:\n\n- ${msgs.slice(0,6).join('\n- ')}${msgs.length>6?`\n- and ${msgs.length-6} more`:''}\n\nAdd the class anyway?`)) return;
  /* warn if this takes the course past its hour target for this type */
  const target = +(course(courseId).targets||{})[type] || 0;
  if(target){
    const already = hSum(S.sessions.filter(x=>x.courseId===courseId && x.type===type && !x.notHeld));
    const after = already + hSum(made);
    if(after > target && !confirm(`${course(courseId).short} ${typeName(type).toLowerCase()} has a target of ${target} hours. ${already.toFixed(1)} are already planned and this adds ${hSum(made).toFixed(1)}, making ${after.toFixed(1)}. Add them anyway?`)) return;
  }
  made.forEach(m=>S.sessions.push(m));
  const r = autoAssign(made,'fill'); save();
  snapshotPF(); ui.pf.topic=''; ui.pfComps=[];
  render();
  toast(`Added ${made.length} class${made.length===1?'':'es'} over ${dates.length} date${dates.length===1?'':'s'}${skipped?`, skipped ${skipped} (holiday or batch away)`:''}. ${report(r)}`);
}
function addBlock(){
  const cid=document.getElementById('bk-c').value, from=document.getElementById('bk-f').value, to=document.getElementById('bk-t').value||from, reason=document.getElementById('bk-r').value;
  let batches=[...document.querySelectorAll('.bk-b:checked')].map(x=>x.value);
  if(!cid||!from){ toast('Pick the course and the first day'); return; }
  if(!batches.length){ toast('Tick the whole class or at least one batch'); return; }
  if(batches.includes('All')) batches=['All'];
  const b={id:uid(), courseId:cid, batches, from, to:to<from?from:to, reason};
  S.blocks.push(b);
  const hit = S.sessions.filter(s=>s.courseId===cid && s.date>=b.from && s.date<=b.to && (batches.includes('All') || batches.includes(s.batch)));
  if(hit.length && confirm(`${hit.length} class${hit.length===1?' is':'es are'} already planned for ${batches.includes('All')?'this class':'these batches'} on those days. Delete ${hit.length===1?'it':'them'}? (Cancel keeps them, shown as "batch away".)`)){
    const ids=new Set(hit.map(s=>s.id)); S.sessions=S.sessions.filter(s=>!ids.has(s.id));
  } else hit.forEach(s=>{ if(!s.locked) s.facultyId=''; });
  ui.bk=null; save(); render(); toast('Marked as away');
}

function copyWeek(){
  const m=monday(ui.anchor), prev=addDays(m,-7);
  const src=S.sessions.filter(s=>s.date>=prev && s.date<=addDays(prev,6));
  if(!src.length){ toast('Last week has no classes to copy'); return; }
  if(S.sessions.some(s=>s.date>=m && s.date<=addDays(m,6)) && !confirm('This week already has classes. Add last week\'s on top of them?')) return;
  const made=[];
  for(const s of src){ const d=addDays(s.date,7); if(holiday(d) || awayBlock(s.courseId,s.batch,d)) continue;
    const n={...s,id:uid(),date:d,comps:[],topic:'',facultyId:'',locked:false,history:[]}; S.sessions.push(n); made.push(n); }
  const r=autoAssign(made,'fill'); save(); toast(`Copied ${made.length} classes (topics left blank for this week). ${report(r)}`);
}

/* ============ Excel ============ */
const serial = s => Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10))/86400000 + 25569;
function xdate(v){
  if(v===''||v==null) return '';
  if(typeof v==='number'){ const d=new Date(Math.round((v-25569)*86400000)); return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()); }
  if(v instanceof Date) return iso(v);
  const t=String(v).trim(); let m;
  if((m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  if((m=t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/))) return m[3]+'-'+pad(m[2])+'-'+pad(m[1]);
  const d=new Date(t); return isNaN(d) ? '' : iso(d);
}
function xtime(v){
  if(typeof v==='number'){ const mm=Math.round((v%1)*1440); return pad(Math.floor(mm/60))+':'+pad(mm%60); }
  const m=String(v||'').trim().match(/^(\d{1,2})[:.](\d{2})\s*(am|pm)?/i); if(!m) return '';
  let h=+m[1]; if(m[3]){ const pm=m[3].toLowerCase()==='pm'; if(pm&&h<12) h+=12; if(!pm&&h===12) h=0; }
  return pad(h)+':'+m[2];
}
const yes = v => /^(y|true|1)/i.test(String(v).trim());
function makeSheet(rows, widths){
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const rg = XLSX.utils.decode_range(ws['!ref']||'A1');
  for(let r=1; r<=rg.e.r; r++) for(let c=0; c<=rg.e.c; c++){
    const a = XLSX.utils.encode_cell({r,c}), cell = ws[a];
    if(cell && typeof cell.v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(cell.v)) ws[a] = {t:'n', v:serial(cell.v), z:'dd-mmm-yyyy'};
  }
  if(widths) ws['!cols'] = widths.map(w=>({wch:w}));
  return ws;
}
function exportXLSX(){
  if(!window.XLSX){ toast('The Excel writer could not load. Check the internet connection.'); return; }
  const wb = XLSX.utils.book_new(), nm = id => person(id)?.name||'', add = (n,rows,w) => XLSX.utils.book_append_sheet(wb, makeSheet(rows,w), n);
  add('How to use', [['How to use this file'],
    ['This file holds the whole roster. Upload it to the GitHub repository as roster-data.xlsx to publish.'],
    ['You can also edit it in Excel. Keep the sheet names and the column headings as they are.'],

    ['Classes: Teacher must match a name on the Faculty sheet exactly. Leave it empty and the page will not fill it in until the clerk runs auto-assign.'],
    ['Classes: Competencies are codes separated by commas, e.g. FM2.1, FM2.2.'],
    ['Faculty: Leave is written as 05-10-2026 to 09-10-2026, with several periods separated by a semicolon. Phone numbers and emails are not kept in this file.'],
    ['Classes: Not held is Yes for a class that did not take place. Leave it empty otherwise.'],
