function fromWorkbook(wb){
  const rows = n => wb.Sheets[n] ? XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}).slice(1).filter(r=>r.some(v=>String(v).trim()!=='')) : [];
  if(!wb.Sheets['Classes'] || !wb.Sheets['Faculty']) throw new Error('This Excel file is not a roster file. It needs the Classes and Faculty sheets.');
  const warn = [], key = v => String(v||'').trim().toLowerCase();
  const d = {settings:{}, types:[], ranks:[], faculty:[], courses:[], sessions:[], holidays:[], blocks:[], rotations:[], competencies:[], swaps:[], meta:{}};
  const dep = {}; rows('Department').forEach(r=>dep[key(r[0])]=r[1]);
  d.settings = {dept:String(dep['department name']||''), inst:String(dep['institution']||''), termStart:xdate(dep['term starts']), termEnd:xdate(dep['term ends']), clerkPhone:String(dep['office whatsapp number']||''), clerkEmail:String(dep['office email']||''), pinHash:String(dep['office pin (hashed)']||dep['clerk pin (hashed)']||'')};
  d.meta = {savedAt:String(dep['saved at']||''), dirty:false};
  /* class types first: the rank ratios and the classes refer to them by name */
  rows('Class types').forEach(r=>{ const n=String(r[0]).trim(); if(!n) return;
    d.types.push({id:n.toLowerCase().replace(/\W+/g,'-').slice(0,20), name:n, style:/solid/i.test(String(r[1]))?'solid':'hatch'}); });
  if(!d.types.length) d.types = DEFAULT_TYPES.map(t=>({...t}));
  const typeBy = n => { const t=String(n||'').trim(); return d.types.find(x=>key(x.name)===key(t) || x.id===key(t)); };
  const rh = (XLSX.utils.sheet_to_json(wb.Sheets['Ranks']||{},{header:1,defval:''})[0]||[]).map(String);
  rows('Ranks').forEach(r=>{
    const w = {};
    if(rh.length>1 && !/ratio/i.test(rh[1])) rh.slice(1).forEach((h,i)=>{ const t=typeBy(h); if(t) w[t.id]=+r[i+1]||0; });
    else { w.theory=+r[1]||0; w.practical=+r[2]||0; }
    d.types.forEach(t=>{ if(w[t.id]==null) w[t.id]=0; });
    d.ranks.push({id:uid(), name:String(r[0]).trim(), w});
  });
  const rankBy = n => { let r = d.ranks.find(x=>key(x.name)===key(n)); if(!r){ const w={}; d.types.forEach(t=>w[t.id]=1); r={id:uid(),name:String(n||'Unranked').trim()||'Unranked',w}; d.ranks.push(r); warn.push(`Rank "${r.name}" was not on the Ranks sheet and was added with ratio 1 everywhere`);} return r.id; };
  /* columns are found by their headings, so older files (with phone columns) still read */
  const fh = (XLSX.utils.sheet_to_json(wb.Sheets['Faculty'],{header:1,defval:''})[0]||[]).map(key);
  const col = (n, dflt) => { const i = fh.findIndex(h=>h.startsWith(n)); return i>=0 ? i : dflt; };
  const cName=col('name',0), cRank=col('rank',1), cAct=col('active',2), cLeave=col('leave',-1), cId=col('id',-1), cPh=col('whatsapp',-1), cEm=col('email',-1);
  if(cPh>=0) warn.push('This file still has phone numbers in it. They were read into this browser; the next file you download leaves them out.');
  rows('Faculty').forEach(r=>{
    const leaves = String(cLeave>=0?r[cLeave]:'').split(';').map(x=>x.trim()).filter(Boolean).map(x=>{ const [a,b]=x.split(/\s+to\s+/i); const f=xdate(a), t=xdate(b||a); return f?{from:f,to:t||f}:null; }).filter(Boolean);
    d.faculty.push({id:String(cId>=0?r[cId]:'').trim()||uid(), name:String(r[cName]).trim(), rank:rankBy(r[cRank]), active:r[cAct]===''?true:yes(r[cAct]), phone:String(cPh>=0?r[cPh]:''), email:String(cEm>=0?r[cEm]:''), leaves});
  });
  const fn = d.faculty.map(f=>key(f.name)), fd=[...new Set(fn.filter((n,i)=>fn.indexOf(n)!==i))];
  if(fd.length) warn.push(`Two or more teachers share a name (${fd.join(', ')}). Classes go to the first one. Add an initial to tell them apart.`);
  const facBy = n => d.faculty.find(f=>key(f.name)===key(n));
  const ch = (XLSX.utils.sheet_to_json(wb.Sheets['Courses']||{},{header:1,defval:''})[0]||[]).map(key);
  const ccol = (n,dflt) => { const i=ch.findIndex(h=>h.startsWith(n)); return i>=0?i:dflt; };
  const kWho=ccol('who can teach',4), kId=ccol('id',5), kTs=ccol('term starts',-1), kTe=ccol('term ends',-1), kTg=ccol('hour target',-1);
  const kWhoT=ch.findIndex(h=>h.startsWith('who can teach, by'));
  rows('Courses').forEach(r=>{
    const allowedIds = String(r[kWho]||'').split(',').map(x=>x.trim()).filter(Boolean).map(n=>{ const f=facBy(n); if(!f) warn.push(`"${n}" under Who can teach is not on the Faculty sheet`); return f?.id; }).filter(Boolean);
    const targets = {};
    if(kTg>=0) String(r[kTg]||'').split(';').map(x=>x.trim()).filter(Boolean).forEach(part=>{ const m=part.match(/^(.*?)[\s:]+([\d.]+)$/); if(!m) return; const t=typeBy(m[1]); if(t) targets[t.id]=+m[2]; });
    const allowedByType = {};
    if(kWhoT>=0) String(r[kWhoT]||'').split(';').map(x=>x.trim()).filter(Boolean).forEach(part=>{
      const i = part.indexOf(':'); if(i<0) return;
      const t = typeBy(part.slice(0,i)); if(!t) return;
      allowedByType[t.id] = part.slice(i+1).split(',').map(x=>x.trim()).filter(Boolean).map(n=>facBy(n)?.id).filter(Boolean);
    });
    d.courses.push({id:String(r[kId]||'').trim()||uid(), name:String(r[0]).trim(), short:String(r[1]||r[0]).trim(), color:/^#[0-9a-f]{6}$/i.test(String(r[2]).trim())?String(r[2]).trim():'#6B5B95',
      batches:String(r[3]||'').split(',').map(x=>x.trim()).filter(Boolean), allowed:allowedIds, allowedByType,
      termStart:kTs>=0?xdate(r[kTs]):'', termEnd:kTe>=0?xdate(r[kTe]):'', targets});
  });
  const courseBy = n => d.courses.find(c=>key(c.short)===key(n)||key(c.name)===key(n));
  const batchOf = v => { const t=String(v||'').trim(); return !t || /^whole/i.test(t) || /^all$/i.test(t) ? 'All' : t.replace(/^batch\s+/i,''); };
  rows('Batches away').forEach(r=>{ const c=courseBy(r[0]); if(!c){ warn.push(`Batches away: course "${r[0]}" not found`); return; }
    const t=String(r[1]||'').trim(); const from=xdate(r[2]); if(!from) return;
    d.blocks.push({id:uid(), courseId:c.id, batches:(!t||/^whole/i.test(t))?['All']:t.split(',').map(x=>x.trim()).filter(Boolean), from, to:xdate(r[3])||from, reason:String(r[4]||'Away')}); });
  const hh = (XLSX.utils.sheet_to_json(wb.Sheets['Holidays']||{},{header:1,defval:''})[0]||[]).map(key);
  const oldHol = hh[0] && hh[0].startsWith('date');
  rows('Holidays').forEach(r=>{ const from=xdate(r[0]); if(!from) return;
    d.holidays.push(oldHol ? {from, to:from, name:String(r[1]||'Holiday')} : {from, to:xdate(r[1])||from, name:String(r[2]||r[1]||'Holiday')}); });
  rows('Rotations').forEach(r=>{ const c=courseBy(r[0]); const name=String(r[1]||'').trim(); const from=xdate(r[2]);
    if(!c || !name || !from) return;
    let rot = d.rotations.find(x=>x.courseId===c.id && key(x.name)===key(name));
    if(!rot){ rot={id:uid(), courseId:c.id, name, entries:[]}; d.rotations.push(rot); }
    rot.entries.push({from, to:xdate(r[3])||from, batches:String(r[4]||'').split(',').map(x=>x.trim()).filter(Boolean)}); });
  let bad=0;
  rows('Classes').forEach((r,i)=>{
    const date=xdate(r[0]), start=xtime(r[2]), end=xtime(r[3]), c=courseBy(r[4]);
    if(!date||!start||!end||!c){ bad++; if(bad<=3) warn.push(`Classes row ${i+2} skipped: check the date, times and course`); return; }
    const t=String(r[10]||'').trim(); let f=t?facBy(t):null;
    if(t && !f) warn.push(`Classes row ${i+2}: teacher "${t}" is not on the Faculty sheet, left unassigned`);
    const ty = typeBy(r[5]) || d.types.find(t=>/^p/i.test(String(r[5])) ? t.id==='practical' : t.id==='theory') || d.types[0];
    const rk = f ? d.ranks.find(x=>x.id===f.rank) : null;
    if(f && !(rk && rk.w && +rk.w[ty.id]>0)){ warn.push(`Classes row ${i+2}: ${f.name}'s rank is not given ${ty.name.toLowerCase()} classes, left unassigned`); f=null; }
    d.sessions.push({id:String(r[12]||'').trim()||uid(), date, start, end, courseId:c.id, type:ty.id, batch:batchOf(r[6]),
      topic:String(r[7]||''), comps:String(r[8]||'').split(',').map(x=>x.trim()).filter(Boolean), venue:String(r[9]||''), facultyId:f?f.id:'', locked:yes(r[11]), notHeld:yes(r[14]||''), history:(()=>{ try{ const h=JSON.parse(r[13]||'[]'); return Array.isArray(h)?h:[]; }catch(e){ return []; } })()});
  });
  if(bad>3) warn.push(`${bad} class rows skipped in all`);
  rows('Competencies').forEach(r=>{ const code=String(r[0]).trim(); if(code) d.competencies.push({code, topic:String(r[1]||'').trim()||'Other', text:String(r[2]||'').trim()}); });
  rows('Swaps').forEach(r=>{ d.swaps.push({id:String(r[10]||'').trim()||uid(), loggedOn:xdate(r[0])||TODAY, classText:String(r[1]||''), fromId:facBy(r[2])?.id||'', toId:facBy(r[3])?.id||'', exchangeText:String(r[4]||''), reason:String(r[5]||''),
    status:['Requested','Accepted','Declined'].find(x=>key(x)===key(r[6]))||'Requested', decidedOn:xdate(r[7]), sessionId:String(r[8]||''), exchangeId:String(r[9]||'')}); });
  return {data:normalize(d), warn};
}

/* read an uploaded competency file and build the check screen */
function readCompFile(wb){
  const name = wb.SheetNames.find(n=>/^competenc/i.test(n)) || wb.SheetNames.find(n=>!/^instruc/i.test(n)) || wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:false,defval:'',blankrows:true});
  let h = rows.findIndex((r,i)=>i<10 && r.some(v=>/^\s*code\s*$/i.test(String(v))));
  let ci=0, ti=1, xi=2;
  if(h>=0){ const hr=rows[h].map(v=>String(v).trim().toLowerCase());
    ci=hr.findIndex(v=>v==='code'); const t=hr.findIndex(v=>v==='topic'); ti=t; const x=hr.findIndex(v=>/^competenc|^description|^wording/.test(v)); xi=x>=0?x:(ci+2); }
  const start = h>=0 ? h+1 : 0, seen = {}, good = [], skipped = [];
  for(let i=start; i<rows.length; i++){
    const r = rows[i], code = String(r[ci]||'').trim(), topic = ti>=0 ? String(r[ti]||'').trim() : '', text = String(r[xi]||'').trim();
    if(!code && !text && !topic) continue;
    const row = i+1 + (XLSX.utils.decode_range(wb.Sheets[name]['!ref']||'A1').s.r);
    if(!code){ skipped.push(`Row ${row}: code missing`); continue; }
    if(!text){ skipped.push(`Row ${row}: ${code} has no competency wording`); continue; }
    if(seen[code.toLowerCase()]){ skipped.push(`Row ${row}: ${code} appears twice (first on row ${seen[code.toLowerCase()]})`); continue; }
    seen[code.toLowerCase()] = row;
    good.push({code, topic:topic||'Other', text});
  }
  let added=0, updated=0, same=0;
  good.forEach(k=>{ const e=S.competencies.find(x=>x.code.toLowerCase()===k.code.toLowerCase()); if(!e) added++; else if(e.text!==k.text||e.topic!==k.topic) updated++; else same++; });
  return {sheet:name, good, skipped, added, updated, same};
}

async function hashPin(p){
  const txt = 'dept-roster:'+p;
  if(window.crypto && crypto.subtle){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  let h = 2166136261; for(const c of txt){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return 'f'+(h>>>0).toString(16);
}
async function fetchPublished(){

      else { if(!window.XLSX) throw new Error('The Excel reader could not load. Check the internet connection.');
        const res=fromWorkbook(XLSX.read(rd.result,{type:'array'})); S=res.data; applyContacts(); saveContacts(); writeLocal(); render();

document.addEventListener('click', e=>{ const el=e.target.closest('[data-act]'); if(!el) return; if(el.tagName==='DETAILS') return; act(el.dataset.act, el); });
document.addEventListener('change', e=>{ const el=e.target.closest('[data-ch]'); if(el) change(el.dataset.ch, el); });
document.addEventListener('input', e=>{ if(e.target.id==='cq' && ui.dlg){ ui.dlg.q=e.target.value; document.getElementById('clist').innerHTML=compListHTML(); } });
document.addEventListener('toggle', e=>{ if(e.target.matches && e.target.matches('details.allow')) ui.openAllow = e.target.open ? e.target.dataset.id : (ui.openAllow===e.target.dataset.id?null:ui.openAllow); }, true);
document.getElementById('dlg').addEventListener('close', ()=>{ ui.dlg=null; });

/* ============ start ============ */
function boot(r){
  ME = r.me || ME;
  if(r.data && r.data.sessions && r.data.sessions.length){ S = normalize(r.data); }
  else if(ME.isOffice){ sample(); dirty = true; setTimeout(pushSave, 600); }
  else { S = normalize({settings:{dept:'Department Teaching Roster', inst:''}}); }
  ui.edit = !!ME.isOffice;
  setState('');
  render();
}
window.boot = boot;
window.remoteUpdate = remoteUpdate;
window.rosterSample = sample;
window.rosterNormalize = normalize;
